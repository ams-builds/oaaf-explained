<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A key is not permission</title>
<desc id="desc">An agent asks to merge a pull request. Its key could do it, but the authority that a person delegated for this task does not include merge. An enforcement point checks the delegated authority before the tool runs, writes a decision of ALLOW or DENY, and keeps evidence of each decision. The tool runs only after ALLOW.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="470" fill="#f5f5f5"/>
<text x="70" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">A Key Is Not Permission</text>
<text x="70" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">THE KEY COULD MERGE. THE DELEGATED AUTHORITY COULD NOT.</text>
<rect x="70" y="112" width="220" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="78" y="120" width="42" height="16" rx="4" fill="#ececec"/>
<text x="99.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AGENT</text>
<text x="180.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Your Agent Asks</text>
<text x="180.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">merge pull request</text>
<text x="180.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">key: full repo access</text>
<rect x="350" y="112" width="220" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="358" y="120" width="42" height="16" rx="4" fill="#ececec"/>
<text x="379.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">CHECK</text>
<text x="460.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Enforcement Point</text>
<text x="460.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">checks the delegated</text>
<text x="460.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">authority first</text>
<line x1="290" y1="160.0" x2="346" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="630" y="112" width="220" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="638" y="120" width="42" height="16" rx="4" fill="#ececec"/>
<text x="659.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">CHECK</text>
<text x="740.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Decision</text>
<text x="740.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">ALLOW or DENY</text>
<text x="740.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">with a reason code</text>
<line x1="570" y1="160.0" x2="626" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="910" y="112" width="220" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="918" y="120" width="36" height="16" rx="4" fill="#ececec"/>
<text x="936.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TOOL</text>
<text x="1020.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Tool Runs</text>
<text x="1020.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">only after ALLOW</text>
<text x="1020.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">never after DENY</text>
<line x1="850" y1="160.0" x2="906" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="460.0" y1="208" x2="460.0" y2="262" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<rect x="350" y="266" width="220" height="76" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="460.0" y="294.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Evidence</text>
<text x="460.0" y="308.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">a record of each</text>
<text x="460.0" y="320.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">allow and each deny</text>
<rect x="630" y="266" width="500" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="880.0" y="294.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Delegated For This Task</text>
<text x="880.0" y="308.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">repo.read, repo.write, create_pull_request</text>
<text x="880.0" y="320.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">no merge, so the answer is DENY</text>
<line x1="70" y1="372" x2="1130" y2="372" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="70" y="398" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="150" y="386" width="42" height="16" rx="4" fill="#ececec"/>
<text x="171.0" y="398" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AGENT</text>
<text x="202" y="398" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the AI agent that wants to act</text>
<rect x="600" y="386" width="42" height="16" rx="4" fill="#ececec"/>
<text x="621.0" y="398" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">CHECK</text>
<text x="652" y="398" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the part that checks authority</text>
<rect x="150" y="418" width="36" height="16" rx="4" fill="#ececec"/>
<text x="168.0" y="430" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TOOL</text>
<text x="196" y="430" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the action that has an effect</text>
<rect x="600" y="420" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="636" y="431" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the step that keeps your agent inside its authority</text>
</svg>
